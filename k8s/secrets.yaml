apiVersion: v1
kind: Secret
metadata:
  name: zelyo-secrets
  namespace: zelyo
type: Opaque
stringData:
  # LLM Provider (openai, gemini, or openrouter)
  LLM_PROVIDER: "gemini"
  
  # API Keys (Fill in the one matching your provider)
  GEMINI_API_KEY: "change-me"
  OPENAI_API_KEY: ""
  OPENROUTER_API_KEY: ""
  
  # GitHub Integration
  GITHUB_TOKEN: "change-me"
  GITHUB_REPO: "org/repo"
  
  # GitHub App (Alternative to Token)
  GITHUB_APP_ID: ""
  GITHUB_APP_PRIVATE_KEY: ""
  GITHUB_APP_INSTALLATION_ID: ""
  
  # Telemetry
  ZELYO_TELEMETRY_ENABLED: "true"
