apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zelyo-guardian
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/connorv001/zelyo-config-test.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: zelyo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
