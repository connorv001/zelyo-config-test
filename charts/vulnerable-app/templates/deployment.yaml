# Deployment with intentional security issues for Zelyo testing
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vulnerable-app.fullname" . }}
  labels:
    {{- include "vulnerable-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "vulnerable-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vulnerable-app.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "vulnerable-app.serviceAccountName" . }}
      # Issue: automountServiceAccountToken should be false
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- end }}
      
      # Issue: No pod security context (missing runAsNonRoot, runAsUser)
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        
        # Issue: No container security context
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        
        # Issue: No resource limits
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        
        # Issue: No liveness probe
        {{- with .Values.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        
        # Issue: No readiness probe
        {{- with .Values.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
