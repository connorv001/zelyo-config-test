{{- if .Values.secret.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zelyo-guardian.fullname" . }}-secrets
  labels:
    {{- include "zelyo-guardian.labels" . | nindent 4 }}
type: Opaque
stringData:
  LLM_PROVIDER: {{ .Values.secret.llmProvider | quote }}
  GEMINI_API_KEY: {{ .Values.secret.geminiApiKey | quote }}
  OPENAI_API_KEY: {{ .Values.secret.openaiApiKey | quote }}
  OPENROUTER_API_KEY: {{ .Values.secret.openrouterApiKey | quote }}
  GITHUB_TOKEN: {{ .Values.secret.githubToken | quote }}
  GITHUB_REPO: {{ .Values.secret.githubRepo | quote }}
  GITHUB_APP_ID: {{ .Values.secret.githubAppId | quote }}
  GITHUB_APP_PRIVATE_KEY: {{ .Values.secret.githubAppPrivateKey | quote }}
  GITHUB_APP_INSTALLATION_ID: {{ .Values.secret.githubAppInstallationId | quote }}
  ZELYO_TELEMETRY_ENABLED: {{ .Values.secret.telemetryEnabled | quote }}
{{- end }}
