apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zelyo-guardian.fullname" . }}
  labels:
    {{- include "zelyo-guardian.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "zelyo-guardian.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "zelyo-guardian.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "zelyo-guardian.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        # Main API Container
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8086"]
          ports:
            - name: http
              containerPort: 8086
              protocol: TCP
          env:
            - name: MCP_SERVER_URL
              value: "http://localhost:{{ .Values.sidecar.port }}/sse"
            - name: ZELYO_DATA_PATH
              value: "/data"
            {{- if .Values.secret.create }}
            - name: LLM_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: {{ include "zelyo-guardian.fullname" . }}-secrets
                  key: LLM_PROVIDER
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "zelyo-guardian.fullname" . }}-secrets
                  key: GEMINI_API_KEY
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "zelyo-guardian.fullname" . }}-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "zelyo-guardian.fullname" . }}-secrets
                  key: OPENROUTER_API_KEY
                  optional: true
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "zelyo-guardian.fullname" . }}-secrets
                  key: GITHUB_TOKEN
                  optional: true
            - name: GITHUB_REPO
              valueFrom:
                secretKeyRef:
                  name: {{ include "zelyo-guardian.fullname" . }}-secrets
                  key: GITHUB_REPO
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "zelyo-guardian.fullname" . }}-secrets
                  key: GITHUB_APP_ID
                  optional: true
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "zelyo-guardian.fullname" . }}-secrets
                  key: GITHUB_APP_PRIVATE_KEY
                  optional: true
            - name: GITHUB_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "zelyo-guardian.fullname" . }}-secrets
                  key: GITHUB_APP_INSTALLATION_ID
                  optional: true
            - name: ZELYO_TELEMETRY_ENABLED
              valueFrom:
                secretKeyRef:
                  name: {{ include "zelyo-guardian.fullname" . }}-secrets
                  key: ZELYO_TELEMETRY_ENABLED
            {{- else if .Values.secret.existingSecretName }}
            # Support map from existing secret if needed, for now assume envFrom if using external secret
            {{- end }}
            
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data-volume
              mountPath: "/data"

        # Sidecar Container (MCP Adapter)
        {{- if .Values.sidecar.enabled }}
        - name: mcp-adapter
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.sidecar.image.repository }}:{{ .Values.sidecar.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.sidecar.image.pullPolicy }}
          command: ["python", "src/kubescape_mcp_adapter.py"]
          env:
            - name: PORT
              value: {{ .Values.sidecar.port | quote }}
          resources:
            {{- toYaml .Values.sidecar.resources | nindent 12 }}
          volumeMounts:
            - name: kubescape-cache
              mountPath: "/.kubescape"
        {{- end }}

      volumes:
        - name: data-volume
          emptyDir: {}
        - name: kubescape-cache
          emptyDir: {}
