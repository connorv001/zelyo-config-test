# Default values for zelyo-guardian.

image:
  repository: zelyo
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "zelyo-sa"

rbac:
  # Specifies whether RBAC resources should be created
  create: true

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: LoadBalancer
  port: 80
  targetPort: 8086

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Sidecar Configuration (Kubescape MCP Adapter)
sidecar:
  enabled: true
  image:
    repository: zelyo
    tag: "latest"
    pullPolicy: IfNotPresent
  port: 8090
  resources: {}

# Secrets Management
secret:
  # If true, creates a Secret resource with the values below
  create: true
  # If false, you must provide an existing secret name via envFrom in deployment template
  # existingSecretName: my-zelyo-secrets
  
  # API Configuration
  llmProvider: "gemini" # openai, gemini, openrouter
  
  # Sensitive values (Recommend using --set or external secrets in prod)
  geminiApiKey: ""
  openaiApiKey: ""
  openrouterApiKey: ""
  githubToken: ""
  githubRepo: "org/repo"
  
  # GitHub App Configuration
  githubAppId: ""
  githubAppPrivateKey: "" # content of .pem file
  githubAppInstallationId: ""
  
  telemetryEnabled: "true"
